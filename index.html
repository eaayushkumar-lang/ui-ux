<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />

    <!-- Resolve DNS for third-party hosts contacted from the contact form
         (EmailJS) and every "Book a Call" link (Cal.com) early, before
         either is actually requested. -->
    <link rel="dns-prefetch" href="https://cal.com" />
    <link rel="dns-prefetch" href="https://api.emailjs.com" />

    <title>Aurevyn — AI Automation Systems for Modern Businesses</title>
    <meta
      name="description"
      content="Aurevyn builds AI agents and automation systems that handle repetitive customer, sales, and operational workflows — so your team focuses on the work that actually needs humans."
    />
    <!-- Placeholder domain until the site has a real production URL. -->
    <link rel="canonical" href="https://aurevynai.site/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aurevynai.site/" />
    <meta property="og:title" content="Aurevyn — AI Automation Systems for Modern Businesses" />
    <meta
      property="og:description"
      content="Aurevyn builds AI agents and automation systems that handle repetitive customer, sales, and operational workflows — so your team focuses on the work that actually needs humans."
    />
    <meta property="og:image" content="https://aurevynai.site/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aurevyn — AI Automation Systems for Modern Businesses" />
    <meta
      name="twitter:description"
      content="Aurevyn builds AI agents and automation systems that handle repetitive customer, sales, and operational workflows — so your team focuses on the work that actually needs humans."
    />
    <meta name="twitter:image" content="https://aurevynai.site/og-image.png" />

    <!-- Google Analytics 4 -->
    <!-- Replace G-XXXXXXXXXX with your real Google Analytics 4 Measurement ID from analytics.google.com -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-XXXXXXXXXX");
    </script>

    <!-- Alternative: Plausible Analytics (privacy-friendly) -->
    <!-- <script defer data-domain="aurevynai.site" src="https://plausible.io/js/script.js"></script> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
